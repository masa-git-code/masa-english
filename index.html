<style>
/* Masa English — "Focus Coach": calm iOS-style surfaces, one accent, system fonts.
   Tokens first (light, then dark via OS setting or [data-theme]), then components. */
:root {
  color-scheme: light;
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --sunk: #ECEEF2;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #5B6576;
  --line: #E3E6EC;
  --line-strong: #C9CED8;
  --accent: #2F5BEA;
  --accent-2: #2F5BEA;
  --accent-press: #2449C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E9EEFD;
  --accent-line: #B4C5F6;
  --accent-glow: rgba(47, 91, 234, 0.30);
  --bubble: #EEF1F6;
  /* tones: used for text (AA on surface) and as fills behind --tone-ink */
  --good: #0A7D3E;
  --warn: #985700;
  --bad: #C22A31;
  --tone-ink: #FFFFFF;
  --good-soft: #E3F4EA;
  --warn-soft: #FCF1DE;
  --bad-soft: #FCE7E8;
  --bar: rgba(255, 255, 255, 0.82);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.08);
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 6px 20px -8px rgba(15, 23, 42, 0.14);
  --shadow-lg: 0 2px 4px rgba(15, 23, 42, 0.06), 0 14px 32px -12px rgba(15, 23, 42, 0.22);
  --seg-on: #FFFFFF;
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-en: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Arial, "Hiragino Sans", sans-serif;
  /* scale */
  --r-lg: 20px;
  --r: 16px;
  --r-sm: 12px;
  --r-xs: 8px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  --tap: 44px;
  --tabbar-h: 60px;
  --mic: 88px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B0F17; --surface: #151B26; --surface-2: #111722; --sunk: #1F2734; --ink: #E8ECF3; --ink-2: #C3CAD6; --muted: #949EAF;
    --line: #262F3D; --line-strong: #364152; --accent: #7C9BFF; --accent-2: #7C9BFF; --accent-press: #9BB3FF; --accent-ink: #0B0F17;
    --accent-soft: #1C2747; --accent-line: #3B4F8C; --accent-glow: rgba(124, 155, 255, 0.35); --bubble: #1C2330;
    --good: #45D58A; --warn: #F2B24C; --bad: #FF7B80; --tone-ink: #0B0F17; --good-soft: #12291D; --warn-soft: #2E2413; --bad-soft: #341B1D;
    --bar: rgba(21, 27, 38, 0.84); --seg-on: #2C3647;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5); --shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 8px 24px -10px rgba(0, 0, 0, 0.7);
    --shadow-lg: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 16px 36px -12px rgba(0, 0, 0, 0.8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0F17; --surface: #151B26; --surface-2: #111722; --sunk: #1F2734; --ink: #E8ECF3; --ink-2: #C3CAD6; --muted: #949EAF;
  --line: #262F3D; --line-strong: #364152; --accent: #7C9BFF; --accent-2: #7C9BFF; --accent-press: #9BB3FF; --accent-ink: #0B0F17;
  --accent-soft: #1C2747; --accent-line: #3B4F8C; --accent-glow: rgba(124, 155, 255, 0.35); --bubble: #1C2330;
  --good: #45D58A; --warn: #F2B24C; --bad: #FF7B80; --tone-ink: #0B0F17; --good-soft: #12291D; --warn-soft: #2E2413; --bad-soft: #341B1D;
  --bar: rgba(21, 27, 38, 0.84); --seg-on: #2C3647;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5); --shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 8px 24px -10px rgba(0, 0, 0, 0.7);
  --shadow-lg: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 16px 36px -12px rgba(0, 0, 0, 0.8);
}
@property --p { syntax: "<number>"; inherits: true; initial-value: 0; }

/* ---------- base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; font-feature-settings: "palt" 1; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.4; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 0.95rem; font-weight: 700; }
p { margin: 0; }
.en-font, .en { font-family: var(--font-en); }
#view { overflow-wrap: anywhere; min-width: 0; }

.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s4);
  padding: max(var(--s3), env(safe-area-inset-top, 0px)) max(var(--s4), env(safe-area-inset-right, 0px)) calc(var(--tabbar-h) + var(--s6) + env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px)); }
main#view { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }

/* ---------- header ---------- */
header.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: var(--tap); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-en); font-weight: 400; font-size: 1.1rem; letter-spacing: -0.01em; color: var(--accent); }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; box-shadow: 0 4px 10px -4px var(--accent-glow); }
.brand .mark svg { width: 18px; height: 18px; }
.brand .brand-strong { color: var(--ink); font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm); color: var(--ink-2); font-size: 0.8rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: var(--s5) var(--s4); display: flex; flex-direction: column; gap: var(--s4); min-width: 0; box-shadow: var(--shadow); }
.card.lift { box-shadow: var(--shadow-lg); }
.card.flat { background: transparent; box-shadow: none; padding: var(--s1) 2px; }
.card.preview { background: transparent; box-shadow: none; border: 1.5px dashed var(--line-strong); }
.eyebrow, .block-label { font-size: 0.75rem; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
.block-label { margin-bottom: 6px; }
.muted { color: var(--muted); font-size: 0.9rem; }
.small { font-size: 0.82rem; line-height: 1.6; }
.row { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 52px; text-align: center; transition: transform 0.12s var(--ease), background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
.btn:active:not(:disabled) { transform: scale(0.97); background-color: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 8px 18px -10px var(--accent-glow); }
.btn.primary:active:not(:disabled) { background: var(--accent-press); border-color: var(--accent-press); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.dark:active:not(:disabled) { background: var(--ink-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:active:not(:disabled) { background: var(--sunk); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: var(--tap); padding: 8px 14px; font-size: 0.9rem; border-radius: var(--r-sm); }
.btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.btn .sub { display: block; font-weight: 500; font-size: 0.78rem; opacity: 0.85; }
.btn.stack { flex-direction: column; gap: 0; line-height: 1.35; padding-block: 10px; }
.icon-btn { border: 0; background: var(--sunk); width: var(--tap); height: var(--tap); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--ink-2); transition: transform 0.12s var(--ease), background-color 0.15s ease, color 0.15s ease; }
.icon-btn:active { transform: scale(0.9); }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
.icon-btn[data-speak] { background: var(--accent-soft); color: var(--accent); }
.icon-btn[data-save] svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.icon-btn.saved { background: var(--accent); color: var(--accent-ink); }
.icon-btn.saved svg { fill: currentColor; }
.due-btn { display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.due-btn b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 10px; font-size: 0.85rem; }
.del-ok { color: var(--bad); border-color: var(--bad); }

/* ---------- segmented controls, tiles, chips ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 13px; }
.seg .chip { border: 0; background: transparent; min-height: var(--tap); border-radius: 10px; font-size: 0.88rem; font-weight: 500; color: var(--ink-2); padding: 6px 4px; transition: background-color 0.15s ease; }
.seg .chip[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-sm); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.tiles .chip { border: 1.5px solid var(--line); background: var(--surface); min-height: 48px; border-radius: var(--r-sm); font-size: 0.92rem; font-weight: 500; padding: 6px 4px; color: var(--ink-2); transition: transform 0.12s var(--ease), background-color 0.15s ease, border-color 0.15s ease; }
.tiles .chip:active, .seg .chip:active, .filter .chip:active { transform: scale(0.96); }
.tiles .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
.filter .chip { border: 1.5px solid var(--line); background: var(--surface); min-height: var(--tap); padding: 6px 16px; border-radius: 999px; font-size: 0.9rem; font-weight: 500; }
.filter .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.setting { display: flex; flex-direction: column; gap: var(--s2); }
.setting .lbl { font-size: 0.85rem; color: var(--ink-2); font-weight: 700; }
.settings { display: flex; flex-direction: column; gap: var(--s4); }
.pass-row { display: flex; gap: var(--s2); }
.pass-row input { flex: 1; min-width: 0; min-height: var(--tap); font-size: 16px; border: 1.5px solid var(--line-strong); border-radius: var(--r-sm); padding: 8px 12px; background: var(--surface); color: var(--ink); }
.pass-row input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.import-box { min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 16px; }

/* collapsible settings panel on home */
details.settings-panel { display: block; padding-block: var(--s1); }
.card.flat.q-head { gap: 10px; }
details.settings-panel > summary { color: var(--ink); font-size: 1rem; min-height: 52px; justify-content: space-between; }
details.settings-panel > summary .sum-sub { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 0.82rem; }
details.settings-panel[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: var(--s4); }
details.settings-panel > .settings { padding-bottom: var(--s4); }

/* ---------- home ---------- */
.hero { padding: var(--s2) 2px 0; display: flex; align-items: center; gap: 10px; }
.hero h1 { font-size: 1.6rem; line-height: 1.3; font-weight: 800; letter-spacing: 0.01em; }
.hero p { color: var(--accent); background: var(--accent-soft); font-size: 0.82rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.today { display: grid; grid-template-columns: 1fr 1fr 1fr; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.today div { padding: var(--s3) var(--s4); display: flex; flex-direction: column; }
.today div + div { border-left: 1px solid var(--line); }
.today .v { font-family: var(--font-en); font-weight: 700; font-size: 1.45rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.today .v small { font-family: var(--font-ui); font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
.today .l { font-size: 0.76rem; color: var(--muted); font-weight: 500; }
.howto { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 0.86rem; color: var(--ink-2); counter-reset: s; margin: 0; padding: 0; list-style: none; }
.howto li { display: contents; }
.howto li::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); color: var(--ink-2); font-size: 0.74rem; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.streak { font-size: 0.8rem; color: var(--muted); }

/* ---------- question ---------- */
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.q-meta .scene { font-size: 0.82rem; color: var(--muted); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-meta .home-btn + .scene { flex: 1; }
.q-meta .count { font-family: var(--font-en); font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; flex: none; }
.q-meta .count small { color: var(--muted); font-weight: 400; }
.home-btn { min-height: var(--tap); min-width: var(--tap); width: var(--tap); padding: 0; margin-left: -6px; flex: none; border-radius: 50%; font-size: 1rem; }
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.progress i { height: 5px; border-radius: 5px; background: var(--sunk); transition: background-color 0.3s ease; }
.progress i.done { background: var(--accent); opacity: 0.45; }
.progress i.now { background: var(--accent); }
.setting-note { font-size: 0.86rem; color: var(--muted); padding-left: var(--s3); border-left: 3px solid var(--line-strong); }
.partner { display: flex; gap: 10px; align-items: flex-end; }
.partner .bubble { background: var(--bubble); border-radius: 18px 18px 18px 6px; padding: 10px 14px 12px; font-family: var(--font-en); font-size: 1.08rem; line-height: 1.5; flex: 1; min-width: 0; color: var(--ink); }
.partner .who { font-size: 0.72rem; color: var(--muted); font-family: var(--font-ui); font-weight: 700; display: block; margin-bottom: 2px; letter-spacing: 0.04em; }
.prompt-wrap { display: flex; flex-direction: column; gap: 6px; }
.prompt-ja { font-size: 1.38rem; font-weight: 700; line-height: 1.6; letter-spacing: 0.02em; color: var(--ink); }
.prompt-ja.sm { font-size: 1.12rem; }
.prompt-label { font-size: 0.75rem; color: var(--accent); font-weight: 700; letter-spacing: 0.06em; }
.timer { display: flex; align-items: center; gap: var(--s3); }
.timer .bar { flex: 1; height: 8px; border-radius: 8px; background: var(--sunk); overflow: hidden; }
.timer .fill { height: 100%; width: 100%; background: var(--accent); border-radius: 8px; transform-origin: left; }
.timer .sec { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 5em; text-align: right; font-size: 0.92rem; color: var(--ink-2); }
.timer.low .fill { background: var(--warn); }
.timer.low .sec { color: var(--warn); }
.timer.over .fill { background: var(--bad); }
.timer.over .sec { color: var(--bad); }
textarea { display: block; width: 100%; min-height: 84px; border: 1.5px solid var(--line-strong); border-radius: var(--r); padding: 14px; font-family: var(--font-en); font-size: 1.1rem; line-height: 1.5; background: var(--surface-2); color: var(--ink); resize: vertical; transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease; }
#view .card.lift:has(#answer) { gap: var(--s3); }
textarea::placeholder { color: var(--muted); font-family: var(--font-ui); font-size: 0.95rem; }
textarea:focus { border-color: var(--accent); background: var(--surface); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.answered { display: flex; gap: var(--s2); align-items: center; font-size: 0.84rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.answered b { color: var(--ink); }
.answered .over { color: var(--bad); font-weight: 700; }
.mic-hint { display: flex; gap: var(--s2); align-items: flex-start; font-size: 0.82rem; color: var(--muted); line-height: 1.55; }
.mic-hint svg { width: 16px; height: 16px; fill: currentColor; flex: none; margin-top: 2px; }
.mic-status { margin: 0 2px; font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center; }
body.typing nav.tabs { display: none; }
body.typing .actionbar { position: static; }

/* ---------- mic: 88px round orb, ripple while .live (press-and-hold wiring lives in JS) ---------- */
.mic-btn { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
.mic-btn { flex-direction: column; gap: 8px; min-height: 0; padding: var(--s2) var(--s2) var(--s1); background: transparent; border: 0; color: var(--ink-2); font-size: 0.86rem; font-weight: 700; }
.mic-btn:active:not(:disabled) { background: transparent; transform: none; }
.mic-orb { position: relative; width: var(--mic); height: var(--mic); border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 24px -10px var(--accent-glow), inset 0 -2px 0 rgba(0, 0, 0, 0.08); transition: transform 0.15s var(--ease), background-color 0.15s ease, box-shadow 0.2s ease; }
.mic-orb svg { width: 34px; height: 34px; fill: currentColor; position: relative; z-index: 1; }
.mic-orb::before, .mic-orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
.mic-btn:active .mic-orb { transform: scale(0.94); }
.mic-btn.live { color: var(--accent); }
.mic-btn.live .mic-orb { background: var(--accent-press); transform: scale(1.06); box-shadow: 0 0 0 8px var(--accent-soft), 0 12px 28px -10px var(--accent-glow); }
.mic-btn.live .mic-orb::before { animation: ripple 1.6s var(--ease) infinite; }
.mic-btn.live .mic-orb::after { animation: ripple 1.6s var(--ease) 0.8s infinite; }
.mic-btn.live svg { animation: micpulse 1s ease-in-out infinite; }
@keyframes ripple { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.7); opacity: 0; } }
@keyframes micpulse { 50% { transform: scale(1.12); } }
.echo-card .mic-btn, .flash .mic-btn { --mic: 76px; }

/* ---------- pinned action bar (sits just above the tab bar) ---------- */
.actionbar { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 4; display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: var(--s2); margin: 0 -8px; background: var(--bar); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
.actionbar.one { grid-template-columns: 1fr; }
.actionbar.two { grid-template-columns: 1fr 1fr; }
.actionbar .btn { min-height: 52px; }

/* ---------- feedback ---------- */
.score-head { display: flex; align-items: center; gap: var(--s4); }
.ring { --p: 0; width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(currentColor calc(var(--p) * 1%), var(--sunk) 0); }
.ring > div { width: 70px; height: 70px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; line-height: 1; }
.ring .n { font-family: var(--font-en); font-weight: 700; font-size: 1.75rem; font-variant-numeric: tabular-nums; }

  *, *::before, *::after { animation: none !important; transition: none !important; }

(() => {

  { id: "b-weekly", partnerName: "Jessica", type: "会議", title: "週次定例ミーティング", setting: "チームの週次定例。司会はマネージャーのJessicaです。", turns: [

const relay = {
  async json(prompt, opts = {}) {
    const url = (window.MASA_CONFIG && window.MASA_CONFIG.workerUrl) || "";
    if (!url) throw { code: "no_worker" };
    if (!settings.pass) throw { code: "no_pass" };
    if (prompt.length > 20000) throw { code: "too_long" };
    const kind = opts.modelTier === "quick" ? "scene" : "grade";
    // Give up instead of waiting forever when the Worker or the AI does not answer.
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), kind === "scene" ? 45000 : 90000);

    if (out?.code === "no_credit") throw { code: "no_credit" };
    if (out?.code === "upstream_error" && out.status === 401) throw { code: "bad_api_key" };

- 各視点の指摘は一番重要なもの1つだけ（問題がなければ空配列）。細かい点まで全部挙げない。
- 解説（why、note、summary）はすべて日本語で、具体的に短く書く。
- アメリカ英語を基準にする。
- 参考の模範解答は一例にすぎない。模範解答と言い方が違っても、日本語の意図が伝わり自然で正しい英語なら減点しない。
- 回答が空・日本語のみ・内容が大きく欠けている場合は低い点数にし、どう言えばよいかを示す。
- score の目安：90以上＝自然で正確、75〜89＝十分通じるが小さな改善点あり、60〜74＝意味は伝わるが不自然・誤りあり、60未満＝意味が伝わりにくい。
  例）「明日までに資料を送ります」→ "I'll send you the materials by tomorrow." は95点。"I send the document until tomorrow." は60点（時制と until の誤り）。
- summary は1文で、一番大事な改善点を言う。
- natural は生徒の回答をもとに、より自然な言い方を2個。トーンの違い（カジュアル／標準／丁寧）が分かるようにする。
- keyPhrase はこの問題で覚えるべき一番大事な英語表現（短いフレーズ）。
- cefr はこの回答だけから推定される話す力のCEFRレベル（A2/B1/B2/C1/C2のどれか）。生徒の普段のレベルを前提にしない。

# 出力（JSONのみ）
- score：総合点（0〜100の整数）。scores：grammar／nuance／structure それぞれ0〜100の整数。
- summary：総評を日本語1〜2文。
- grammar／nuance／structure：指摘の配列。各要素は from（生徒の該当部分）、to（直した英語）、why（日本語の解説）。
- answerJa：生徒の回答（書き起こし）をそのまま訳した自然な日本語。誤りがあっても直さずに、言った内容どおりに訳す。
- corrected：生徒の回答を最小限の修正で正しくした英文。
- natural：より自然な英語の配列。各要素は en、tone（カジュアル／標準／丁寧のどれか）、note（日本語で使いどころ）。
- keyPhrase：en、ja、note（日本語の解説）。
- cefr：A2／B1／B2／C1／C2のどれか。
- judge：生徒の回答そのものへの○×判定。各noteは日本語1文で、生徒の回答の具体的な語句に触れる。
  - meaning：日本語の意図が相手に伝わるか（○＝伝わる、△＝一部伝わらない・誤解の恐れ、×＝伝わらない）。
  - grammar：文法が正しいか（○＝誤りなし、△＝小さな誤りあり、×＝意味に影響する誤りあり）。
  - pronunciation：書き起こしから推定する発音（○＝意図した単語どおり認識された、△＝似た音の別の単語に変わった箇所がある、×＝多くの単語が別の語に認識された）。文脈上ありえない単語（例：right→light、think→sink）があれば発音の誤りの可能性として指摘する。音声認識の確信度が低い場合も参考にする。キーボード入力の場合は「－」。`;
  const fb = await sample.json(prompt, { cache: false });
  if (!fb || typeof fb.score !== "number" || !fb.scores || ["grammar", "nuance", "structure"].some((k) => typeof fb.scores[k] !== "number")) throw { code: "invalid_json" };
  const clamp = (n) => Math.max(0, Math.min(100, Math.round(Number(n) || 0)));
  fb.score = clamp(fb.score);
  fb.scores = { grammar: clamp(fb.scores?.grammar), nuance: clamp(fb.scores?.nuance), structure: clamp(fb.scores?.structure) };
  for (const k of ["grammar", "nuance", "structure", "natural"]) fb[k] = Array.isArray(fb[k]) ? fb[k].filter((x) => x && typeof x === "object") : [];
  fb.summary = String(fb.summary || ""); fb.corrected = String(fb.corrected || ""); fb.answerJa = String(fb.answerJa || "");
  fb.keyPhrase = fb.keyPhrase && typeof fb.keyPhrase === "object" ? fb.keyPhrase : null;
  fb.cefr = LEVELS.includes(fb.cefr) ? fb.cefr : null;
  fb.judge = normJudge(fb);
  if (!speech.spoke) { fb.judge.pronunciation = "－"; fb.judge.pronunciationNote = "キーボード入力のため判定なし"; }
  return fb;
}

// ○△× for meaning, grammar and pronunciation. Older Workers do not send "judge", so derive it from the scores.
function normJudge(fb) {
  const j = fb.judge && typeof fb.judge === "object" ? fb.judge : {};
  const m = (v, ok) => (["○", "△", "×", "－"].includes(v) ? v : ok);
  const by = (n) => (n >= 80 ? "○" : n >= 60 ? "△" : "×");
  return {
    meaning: m(j.meaning, by(fb.score)), meaningNote: String(j.meaningNote || ""),
    grammar: m(j.grammar, fb.grammar.length ? by(Math.min(fb.scores.grammar, 79)) : by(fb.scores.grammar)), grammarNote: String(j.grammarNote || fb.grammar[0]?.why || ""),
    pronunciation: m(j.pronunciation, "－"), pronunciationNote: String(j.pronunciationNote || (j.pronunciation ? "" : "Workerを最新版に貼り替えると判定されます")),
  };
}
/* ---------- practice state ---------- */
const st = { draft: "", view: "home", tab: "practice", scene: null, idx: 0, results: [], startAt: 0, limit: 0, raf: 0, genError: "", loadingMsg: "" };

function nextBuiltin(type) {
  const used = lsGet("me.usedBuiltin", []);
  let pool = BUILTIN.filter((s) => (type === "おまかせ" || s.type === type || (type === "取引先" && s.type === "電話")));
  if (!pool.length) pool = BUILTIN;
  let s = pool.find((x) => !used.includes(x.id));
  if (!s) { s = pool[0]; lsSet("me.usedBuiltin", used.filter((id) => !pool.some((p) => p.id === id))); }
  return s;
}
function markBuiltinUsed(id) { const u = lsGet("me.usedBuiltin", []); if (!u.includes(id)) { u.push(id); lsSet("me.usedBuiltin", u); } }

async function startRound(useAI) {
  stopTimer();
  st.genError = "";
  let scene = null;
  if (useAI) {
    const token = (st.genToken = (st.genToken || 0) + 1);
    st.view = "loading"; st.loadingMsg = "シーン作成中"; render();
    try { scene = await generateScene(settings.type); }
    catch (e) { st.genError = aiErrorText(e) .replace("添削できません", "シーンを作れません").replace("添削できませんでした", "シーンを作れませんでした") + " 定番シーンで始めます。"; }
    if (token !== st.genToken) return; // cancelled while waiting
  }
  if (!scene) { scene = nextBuiltin(settings.type); markBuiltinUsed(scene.id); }
  const recent = lsGet("me.recentScenes", []); recent.unshift(scene.title); lsSet("me.recentScenes", recent.slice(0, 20));
  st.scene = scene; st.idx = 0; st.results = scene.turns.map(() => null);
  showQuestion();
}

function showQuestion() {
  st.view = "question";
  st.draft = "";
  st.limit = timeLimit(st.scene.turns[st.idx].ja);
  st.startAt = performance.now(); st.awayAt = 0; st.confs = []; st.spoke = false;
  render();
  startTimer();
}
function stopTimer() { cancelAnimationFrame(st.raf); st.raf = 0; }
function startTimer() {
  stopTimer();
  const tick = () => {
    const box = $("#timer"); if (!box || st.view !== "question" || st.results[st.idx]) return;
    const el = (performance.now() - st.startAt) / 1000;
    const left = st.limit - el;
    box.classList.toggle("low", left <= st.limit * 0.3 && left > 0);
    box.classList.toggle("over", left <= 0);
    $(".fill", box).style.transform = `scaleX(${Math.max(0, left / st.limit)})`;
    $(".sec", box).textContent = left > 0 ? `残り ${Math.ceil(left)}秒` : `+${Math.floor(-left)}秒`;
    st.raf = requestAnimationFrame(tick);
  };
  st.raf = requestAnimationFrame(tick);
}

async function submitAnswer(pass) {
  if (st.submitting) return;
  if (mic.active) {
    // Safari delivers the last words after stop(); wait for them so they are graded, not pasted into the next question.
    st.submitting = true;
    try { await micStopAndWait(); } finally { st.submitting = false; }
    if (st.view !== "question" || st.results[st.idx]) return;
  }
  const ta = $("#answer");
  const answer = pass ? "" : (ta?.value || "").trim();
  if (!pass && !answer) { toast("英語で回答を入力してください"); ta?.focus(); return; }
  stopTimer();
  const seconds = Math.round(((performance.now() - st.startAt) / 1000) * 10) / 10;
  const idx = st.idx, scene = st.scene;
  const confs = (st.confs || []).filter((c) => c > 0);
  const speech = { spoke: !!st.spoke, conf: confs.length ? Math.round(Math.min(...confs) * 100) / 100 : null };
  const r = { answer, seconds, limit: st.limit, pass: !!pass, status: pass ? "pass" : "pending", fb: null, error: "", speech };
  st.results[idx] = r;
  render();
  if (pass) return;
  runGrade(scene, idx, r);
}
async function runGrade(scene, idx, r) {
  r.status = "pending"; r.error = ""; rerenderIfVisible(scene, idx);
  try {
    r.fb = await gradeAnswer(scene, idx, r.answer, r.speech || {});
    r.status = "done";
    const t = scene.turns[idx];
    addAttempt({ schema: "masa-english/attempt@1", at: new Date().toISOString(), day: todayKey(), sceneTitle: scene.title, sceneType: scene.type,
      ja: t.ja, model: t.en, answer: r.answer, score: r.fb.score, scores: r.fb.scores, cefr: r.fb.cefr, seconds: r.seconds, limit: r.limit, overTime: r.seconds > r.limit });
  } catch (e) { r.status = "error"; r.error = aiErrorText(e); }
  rerenderIfVisible(scene, idx);
}
function rerenderIfVisible(scene, idx) {
  if (st.tab !== "practice" || st.scene !== scene) return;
  if (st.view === "question" && st.idx === idx) { const box = $("#feedback"); if (box) box.innerHTML = feedbackHTML(scene, idx); }
  else if (st.view === "summary") render();
}
function nextQuestion() {
  if (st.idx < st.scene.turns.length - 1) { st.idx++; showQuestion(); window.scrollTo({ top: 0 }); }
  else { st.view = "summary"; render(); window.scrollTo({ top: 0 }); }
}

/* ---------- saving weak expressions ---------- */
async function savePhrase(en, ja, note, src) {
  if (isSaved(en)) { toast("保存済みです"); return; }
  const ok = await addPhrase({ schema: "masa-english/phrase@1", en: String(en), ja: String(ja || ""), note: String(note || ""),
    sceneTitle: src?.scene?.title || "", sceneType: src?.scene?.type || "", sourceJa: src?.ja || "", yourAnswer: src?.answer || "",
    createdAt: new Date().toISOString(), reviewCount: 0, correctCount: 0, lastReviewedAt: null, mastered: false, interval: 0, dueAt: new Date(Date.now() + DAY_MS).toISOString(), tags: [] });
  if (ok) { toast("苦手な表現に保存しました"); document.querySelectorAll(`[data-save-key="${CSS.escape(String(en).toLowerCase())}"]`).forEach((b) => b.classList.add("saved")); }
}

/* ---------- rendering ---------- */
function render() {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === st.tab ? "page" : "false"));
  renderLevelPill();
  const v = $("#view");
  if (st.tab === "practice") v.innerHTML = practiceHTML();
  else if (st.tab === "review") v.innerHTML = reviewHTML();
  else v.innerHTML = statsHTML();
  if (st.tab === "practice" && st.view === "question" && !st.results[st.idx]) startTimer();
  if (!$("#answer")) document.body.classList.remove("typing");
}

/* stats */
function stats() {
  const a = data.attempts;
  const recent = a.slice(0, 20);
  const mean = (arr, f) => (arr.length ? Math.round(arr.reduce((s, x) => s + f(x), 0) / arr.length) : null);
  // Records without sub-scores are left out instead of counting as 0.
  const sub = (k) => { const has = recent.filter((x) => typeof x.scores?.[k] === "number"); return mean(has, (x) => x.scores[k]); };
  const levelCounts = {}; recent.forEach((x) => x.cefr && (levelCounts[x.cefr] = (levelCounts[x.cefr] || 0) + 1));
  let level = null;
  if (recent.filter((x) => x.cefr).length >= 20) {
    const idxs = recent.filter((x) => x.cefr).map((x) => LEVELS.indexOf(x.cefr)).sort((p, q) => p - q);
    level = LEVELS[idxs[Math.floor(idxs.length / 2)]];
  }
  const byDay = {};
  a.forEach((x) => { (byDay[x.day] ||= []).push(x); });
  const days = Object.keys(byDay).sort().slice(-14).map((d) => ({ d, n: byDay[d].length, avg: mean(byDay[d], (x) => x.score) }));
  const sec = recent.length ? Math.round((recent.reduce((s, x) => s + (Number(x.seconds) || 0), 0) / recent.length) * 10) / 10 : null;
  const inTime = recent.length ? Math.round((recent.filter((x) => !x.overTime).length / recent.length) * 100) : null;
  return { total: a.length, days, level, avg: mean(recent, (x) => x.score),
    g: sub("grammar"), n: sub("nuance"), s: sub("structure"), sec, inTime, recentN: recent.length };
}
function streakDays() {
  const days = new Set(data.attempts.map((a) => a.day));
  let n = 0; const d = new Date();
  if (!days.has(todayKey(d))) d.setDate(d.getDate() - 1); // today not practiced yet: count up to yesterday
  while (days.has(todayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderLevelPill() { const s = stats(); $("#levelPill").textContent = s.level ? `推定レベル ${s.level}` : "推定レベル —"; }

function chartSVG(days) {
  if (days.length < 2) return `<p class="empty">2日分以上で表示</p>`;
  const W = 340, H = 150, L = 28, R = 10, T = 12, B = 24;
  const x = (i) => L + (i * (W - L - R)) / (days.length - 1);
  const y = (v) => T + ((100 - v) * (H - T - B)) / 100;
  const pts = days.map((d, i) => [x(i), y(d.avg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`;
  const grid = [0, 50, 100].map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  const step = Math.ceil(days.length / 6);
  const labels = days.map((d, i) => (i % step === 0 || i === days.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === days.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${Number(d.d.slice(5, 7))}/${Number(d.d.slice(8))}</text>` : "").join("");
  const dots = pts.map((p, i) => `<circle class="pt ${i === pts.length - 1 ? "last" : ""}" cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの平均点">${grid}<path class="area" d="${area}"/><path class="ln" d="${line}"/>${dots}${labels}</svg></div>`;
}

    <div class="stack-list">${data.attempts.slice(0, 8).map((x) => `<div class="res-item"><div class="res-top"><span class="muted small">${esc(x.sceneTitle)} ・ ${esc(x.seconds)}秒</span><span class="s tone-${tone(x.score)}">${esc(x.score)}点</span></div><p style="font-size:0.92rem">${esc(x.ja)}</p><p class="yours">${esc(x.answer)}</p></div>`).join("")}</div>

/* ---------- connection test: checks the Worker settings without calling the AI ---------- */
async function runPing() {
  const out = $("#pingResult"); if (!out) return;
  const say = (t) => { out.textContent = t; };
  const url = window.MASA_CONFIG?.workerUrl;
  if (!url) return say("NG：config.js にWorkerのURLがありません。");
  if (!settings.pass) return say("NG：先に合言葉を入力して「保存」してください。");
  say("確認中…");
  let res;
  try {
    res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + settings.pass }, body: JSON.stringify({ kind: "ping" }) });
  } catch {
    return say("NG：Workerにつながりません。①Workerのコードが見本（Hello World）のまま ②ALLOWED_ORIGIN が https://masa-git-code.github.io になっていない、のどちらかです。");
  }
  const body = await res.json().catch(() => ({}));
  if (res.status === 400) return say("OK：Workerのコード・ANTHROPIC_API_KEY・APP_TOKEN・ALLOWED_ORIGIN・合言葉はすべて設定されています。APIキーが有効かは、実際に添削して確認してください。");
  if (res.status === 401) return say("NG：合言葉がCloudflareのAPP_TOKENと一致しません。");
  if (body.code === "server_not_configured") return say("NG：CloudflareでANTHROPIC_API_KEYかAPP_TOKEN（シークレット）が設定されていません。");
  if (body.code === "forbidden_origin") return say("NG：ALLOWED_ORIGIN が https://masa-git-code.github.io になっていません。");
  say("NG：予期しない応答です（" + res.status + " " + (body.code || "") + "）。");
}

/* ---------- import (from the earlier Claude version's JSON export) ---------- */
const safeId = (id) => typeof id === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(id);
function importJson(text) {
  let obj; try { obj = JSON.parse(text); } catch { toast("JSONを読み取れませんでした"); return; }
  const list = Array.isArray(obj) ? obj : obj?.phrases;
  const atts = Array.isArray(obj?.attempts) ? obj.attempts : [];
  if (!Array.isArray(list) && !atts.length) { toast("苦手な表現のデータが見つかりません"); return; }
  let added = 0, addedAtt = 0;
  const haveAtt = new Set(data.attempts.map((a) => a.id));
  for (const a of atts) {
    if (!a || typeof a !== "object" || !safeId(a.id) || haveAtt.has(a.id) || !Number.isFinite(Number(a.score))) continue;
    const n = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
    const sc = a.scores && typeof a.scores === "object" ? a.scores : null;
    data.attempts.push({ id: a.id, schema: "masa-english/attempt@1", at: String(a.at || ""), day: String(a.day || "").slice(0, 10),
      sceneTitle: String(a.sceneTitle || ""), sceneType: String(a.sceneType || ""), ja: String(a.ja || ""), model: String(a.model || ""), answer: String(a.answer || ""),
      score: n(a.score), scores: sc ? { grammar: n(sc.grammar), nuance: n(sc.nuance), structure: n(sc.structure) } : null,
      cefr: LEVELS.includes(a.cefr) ? a.cefr : null, seconds: n(a.seconds), limit: n(a.limit), overTime: !!a.overTime });
    haveAtt.add(a.id); addedAtt++;
  }
  data.attempts.sort((x, y) => String(y.at || "").localeCompare(String(x.at || "")));
  for (const p of (Array.isArray(list) ? list : [])) {
    if (!p || !p.en || isSaved(p.en)) continue;
    data.phrases.push({ id: safeId(p.id) ? p.id : uid(), schema: "masa-english/phrase@1", en: String(p.en), ja: String(p.ja || ""), note: String(p.note || ""),
      sceneTitle: p.sceneTitle || "", sceneType: p.sceneType || "", sourceJa: p.sourceJa || "", yourAnswer: p.yourAnswer || "",
      createdAt: String(p.createdAt || new Date().toISOString()), reviewCount: Math.max(0, Math.floor(Number(p.reviewCount) || 0)), correctCount: Math.max(0, Math.floor(Number(p.correctCount) || 0)),
      lastReviewedAt: p.lastReviewedAt ? String(p.lastReviewedAt) : null, mastered: !!p.mastered,
      interval: Math.max(0, Number(p.interval) || 0), ...(Date.parse(p.dueAt) ? { dueAt: new Date(p.dueAt).toISOString() } : {}), tags: Array.isArray(p.tags) ? p.tags.map(String) : [] });
    added++;
  }
  data.phrases.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  saveLocal(); changed(); toast(addedAtt ? `表現${added}件・記録${addedAtt}件を読み込みました` : `${added}件を読み込みました`);
}
document.addEventListener("change", (ev) => {
  if (ev.target.id !== "importFile") return;
  const f = ev.target.files?.[0]; if (!f) return;
  f.text().then(importJson); ev.target.value = "";
});

/* ---------- press-and-hold English speech recognition (Safari / Chrome Web Speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const mic = { rec: null, holding: false, toggled: false, active: false, base: "", text: "", heard: false, downAt: 0, failed: false, ta: null, onDone: null };
function micUI() {
  const b = $("#micBtn"), l = $("#micLabel"); if (!b || !l || !SR) return;
  b.classList.toggle("live", mic.active);
  l.textContent = mic.active ? (mic.toggled ? "聞き取り中…（タップで停止）" : "聞き取り中…（離すと停止）") : "押している間だけ英語で聞き取る";
}
const qKey = () => (st.scene ? st.scene.id + ":" + st.idx : "");
// Small status line under the mic button, so a failed test on the phone says why.
function micStatus(msg) { const el = $("#micStatus"); if (el) { el.textContent = msg || ""; el.hidden = !msg; } }
const MIC_ERRORS = {
  "not-allowed": "マイクが許可されていません。iPhoneの「設定」→「Safari」→「マイク」を「確認」か「許可」にしてください。",
  "service-not-allowed": "音声認識が使えません。iPhoneの「設定」→「一般」→「キーボード」→「音声入力」をオンにしてください。ホーム画面のアイコンから開いている場合は、Safariで開いてください。",
  "audio-capture": "マイクが使えません。他のアプリがマイクを使っていないか確認してください。",
  "network": "音声認識のサーバーにつながりません。電波を確認してください。",
  "no-speech": "声が聞き取れませんでした。ボタンを押したまま、少し大きめに話してください。",
};
// Write the whole transcript of this listening session after what was already typed.
// Rebuilt from all results each time: iPhone Safari often never marks results final.
function micWrite() {
  // Only write into the answer box this listening session started in (not the next question's).
  const ta = mic.ta; if (!ta) return;
  const said = mic.text.trim();
  const sep = mic.base && said && !/\s$/.test(mic.base) ? " " : "";
  const v = (mic.base + sep + said).trimStart();
  if (!ta.isConnected) { if (ta.id === "answer" && mic.qKey === qKey()) st.draft = v; return; }
  if (ta.id !== "answer") { ta.textContent = v; return; }
  ta.value = v;
  st.draft = ta.value;
  const hd = $("#heard"); if (hd) hd.textContent = v || "";
}
function micStart() {
  if (!SR || mic.active) return;
  const tid = $("#micBtn")?.dataset.target || "answer";
  const ta = document.getElementById(tid); if (!ta) return;
  // A re-speak starts fresh each time; the answer box keeps what was already typed.
  mic.qKey = qKey(); mic.confs = [];
  mic.base = tid === "answer" ? ta.value : ""; mic.text = ""; mic.failed = false; mic.heard = false; mic.ta = ta;
  if (tid !== "answer") ta.textContent = "";
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  rec.onaudiostart = () => micStatus("マイクON・英語で話してください");
  rec.onspeechstart = () => micStatus("声を聞き取っています…");
  rec.onresult = (ev) => {
    // iPhone sometimes repeats earlier words inside the next result; keep the longer one instead of doubling.
    const parts = []; const confs = [];
    for (let i = 0; i < ev.results.length; i++) { const a = ev.results[i][0]; const tr = a.transcript.trim(); if (tr) parts.push(tr); if (ev.results[i].isFinal && a.confidence > 0) confs.push(a.confidence); }
    mic.confs = confs;
    const t = mergeSpeech(parts) + " ";
    mic.text = t; mic.heard = true;
    micWrite();
  };
  rec.onerror = (ev) => {
    if (ev.error === "aborted") return;
    if (ev.error === "no-speech" && mic.holding) return; // keep waiting while held
    mic.failed = true;
    micStatus((MIC_ERRORS[ev.error] || "音声認識でエラーが起きました。") + `（${ev.error}）`);
  };
  rec.onend = () => {
    // Keep what was heard, then restart while the button is still held (Safari stops after a pause).
    if (mic.text) { const said = mic.text.trim(); mic.base = (mic.base + (mic.base && !/\s$/.test(mic.base) ? " " : "") + said).trimStart(); mic.text = ""; }
    micWrite();
    if (mic.ta?.id === "answer" && mic.qKey === qKey()) { if (mic.heard) st.spoke = true; st.confs = (st.confs || []).concat(mic.confs || []); mic.confs = []; }
    let restartFailed = false;
    if ((mic.holding || mic.toggled) && !mic.failed && mic.rec === rec && mic.ta?.isConnected) { try { rec.start(); return; } catch { restartFailed = true; } }
    if (mic.rec === rec) { mic.active = false; mic.rec = null; mic.toggled = false; micUI(); }
    if (restartFailed) micStatus("マイクが止まりました。もう一度ボタンを押してください。");
    else if (!mic.failed) micStatus(mic.heard ? "" : "英語が聞き取れませんでした。ボタンを押したまま、はっきり話してください。");
    const done = mic.onDone; mic.onDone = null; done?.();
    if (mic.rec === null && mic.ta && mic.ta.id === "echoOut" && mic.ta.isConnected) echoFinished(mic.base.trim());
  };
  try { rec.start(); mic.rec = rec; mic.active = true; micUI(); micStatus("マイクを準備しています…"); }
  catch (e) { mic.active = false; micStatus("音声認識を開始できませんでした。（" + (e && e.name || "start") + "）"); }
}
function echoFinished(said) {
  if (!said) return;
  if (st.tab === "review" && rv.mode === "flash") { const shown = rv.reveal; rv.said = said; rv.reveal = true; render(); if (!shown) speak(rv.queue[rv.i].en); return; }
  const r = st.results[st.idx]; if (!r || st.view !== "question") return;
  r.echo = { said, pct: wordMatch(st.scene.turns[st.idx].en, said).pct };
  const box = $("#echoCard"); if (box) box.outerHTML = echoCardHTML(st.scene.turns[st.idx], r);
}
// Join recognition results; drops words a later result repeats (Safari re-sends and re-punctuates them).
function mergeSpeech(parts) {
  const key = (w) => w.toLowerCase().replace(/[^a-z0-9']/g, "");
  let words = [];
  for (const part of parts) {
    const nw = part.split(/\s+/).filter(Boolean);
    const a = words.map(key).join(" "), b = nw.map(key).join(" ");
    if (a && (b === a || b.startsWith(a + " "))) { words = nw; continue; }     // new result contains the old one
    if (a && (a === b || a.endsWith(" " + b) || a.includes(" " + b + " ") || a.startsWith(b + " "))) continue; // already have it
    let ov = 0; // overlap between end of old and start of new
    for (let k = Math.min(words.length, nw.length); k > 0; k--) {
      if (words.slice(-k).map(key).join(" ") === nw.slice(0, k).map(key).join(" ")) { ov = k; break; }
    }
    words = words.concat(nw.slice(ov));
  }
  return words.join(" ");
}
function micStop() { mic.holding = false; mic.toggled = false; try { mic.rec?.stop(); } catch {} }
// After the person finishes speaking an answer, grade it automatically.
function micFinishAnswer() {
  const isAnswer = mic.ta?.id === "answer", key = mic.qKey;
  micStopAndWait().then(() => {
    if (!isAnswer || key !== qKey() || st.view !== "question" || st.results[st.idx] || st.typeMode) return;
    if ((st.draft || "").trim()) submitAnswer(false);
  });
}
// Stop and wait (at most 1.5 s) for Safari's last result and onend.
function micStopAndWait() {
  return new Promise((resolve) => {
    if (!mic.active) return resolve();
    const t = setTimeout(() => {
      // iOS sometimes never fires onend: reset so the mic works on the next question.
      mic.onDone = null; try { mic.rec?.abort(); } catch {}
      mic.active = false; mic.rec = null; mic.toggled = false; micUI(); resolve();
    }, 1500);
    mic.onDone = () => { clearTimeout(t); resolve(); };
    micStop();
  });
}
document.addEventListener("pointerdown", (ev) => {
  const b = ev.target.closest?.("#micBtn"); if (!b || !SR) return;
  ev.preventDefault();
  if (mic.active && mic.toggled) { micFinishAnswer(); return; }
  mic.holding = true; mic.downAt = performance.now(); micStatus("マイクを準備しています…"); micStart();
});
const micRelease = (ev) => {
  if (!mic.holding) return;
  mic.holding = false;
  // A quick tap switches to tap-to-start / tap-to-stop mode instead of stopping at once.
  if (performance.now() - mic.downAt < 350 && mic.active) { mic.toggled = true; micUI(); return; }
  micFinishAnswer();
};
document.addEventListener("pointerup", micRelease);
document.addEventListener("pointercancel", micRelease);
document.addEventListener("contextmenu", (ev) => { if (ev.target.closest?.("#micBtn")) ev.preventDefault(); });

/* ---------- events ---------- */
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.tab) {
    if (mic.active) await micStopAndWait();
    // Tapping 練習 again outside a question goes back to the home screen (settings, scene type).
    if (st.tab === "practice" && b.dataset.tab !== "practice" && st.view === "question" && !st.results[st.idx]) st.awayAt = performance.now();
    if (b.dataset.tab === "practice" && st.awayAt) { st.startAt += performance.now() - st.awayAt; st.awayAt = 0; }
    if (b.dataset.tab === "practice" && st.tab === "practice" && st.view !== "question" && st.view !== "loading") st.view = "home"; st.tab = b.dataset.tab; rv.mode = "list"; if (st.tab !== "practice") stopTimer(); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.speak) { speak(b.dataset.speak); return; }
  if (b.dataset.save) {
    const q = b.dataset.q !== "" && b.dataset.q != null ? Number(b.dataset.q) : st.idx;
    const r = st.results?.[q];
    const t = st.scene?.turns?.[q];
    savePhrase(b.dataset.save, b.dataset.ja, b.dataset.note, { scene: st.scene, ja: t?.ja, answer: r?.answer });
    return;
  }
  if (b.dataset.type) { settings.type = b.dataset.type; saveSettings(); render(); return; }
  if (b.dataset.pace) { settings.pace = b.dataset.pace; saveSettings(); render(); return; }
  if (b.dataset.rate) { settings.rate = Number(b.dataset.rate); saveSettings(); render(); return; }
  if (b.dataset.filter) { rv.filter = b.dataset.filter; render(); return; }
  if (b.dataset.del) { rv.confirmDel = b.dataset.del; render(); return; }
  if (b.dataset.delOk) { rv.confirmDel = null; await deletePhrase(b.dataset.delOk); render(); return; }
  switch (b.dataset.act) {
    case "start-ai": startRound(true); break;
    case "start-builtin": startRound(false); break;
    case "cancel-gen": st.genToken = (st.genToken || 0) + 1; startRound(false); break;
    case "submit": submitAnswer(false); break;
    case "ping": { runPing(); break; }
    case "save-pass": { const v = ($("#passInput")?.value || "").trim(); if (!v) { toast("合言葉を入力してください"); break; }
      if (!/^[\x21-\x7E]+$/.test(v)) { toast("合言葉は半角の英数字・記号で入力してください（CloudflareのAPP_TOKENも同じ値に）"); break; } settings.pass = v; saveSettings(); aiOff.flag = false; toast("合言葉を保存しました"); render(); break; }
    case "type-mode": { if (mic.active) await micStopAndWait(); st.typeMode = true; render(); $("#answer")?.focus(); break; }
    case "pass": submitAnswer(true); break;
    case "next": if (mic.active) await micStopAndWait(); nextQuestion(); break;
    case "retry": { const i = Number(b.dataset.idx); const r = st.results[i]; if (r) runGrade(st.scene, i, r); break; }
    case "go-practice": st.tab = "practice"; render(); break;
    case "home": if (mic.active) await micStopAndWait(); stopTimer(); st.view = "home"; st.genError = ""; render(); window.scrollTo({ top: 0 }); break;
    case "go-review": st.tab = "review"; rv.mode = "list"; render(); window.scrollTo({ top: 0 }); break;
    case "fl-start": {
      if (mic.active) await micStopAndWait();
      const due = duePhrases();
      // Nothing due: review the ones coming up next instead.
      rv.queue = (due.length ? due : data.phrases.filter((p) => !p.mastered).sort((a, b) => dueAt(a) - dueAt(b))).slice(0, 10);
      if (!rv.queue.length) break;
      rv.i = 0; rv.reveal = false; rv.said = ""; rv.mode = "flash"; render(); break;
    }
    case "fl-reveal": if (mic.active) await micStopAndWait(); if (rv.reveal) break; rv.reveal = true; render(); speak(rv.queue[rv.i].en); break; // echoFinished may already have revealed and spoken
    case "fl-ok": case "fl-again": {
      const p = rv.queue[rv.i]; const ok = b.dataset.act === "fl-ok";
      if (mic.active) micStop();
      const correct = (p.correctCount || 0) + (ok ? 1 : 0);
      updatePhrase(p.id, { reviewCount: (p.reviewCount || 0) + 1, correctCount: ok ? correct : 0, lastReviewedAt: new Date().toISOString(), ...srsNext(p, ok) });
      rv.i++; rv.reveal = false; rv.said = "";
      if (rv.i >= rv.queue.length) { rv.mode = "list"; toast(`${rv.queue.length}件の復習が終わりました`); }
      render(); break;
    }
    case "fl-quit": if (mic.active) await micStopAndWait(); rv.mode = "list"; render(); break;
    case "export": {
      const blob = new Blob([exportPayload()], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `masa-english-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      break;
    }
    case "import": { $("#importFile")?.click(); break; }
    case "import-paste": {
      const ta = $("#importText"); if (!ta) break;
      if (ta.hidden) { ta.hidden = false; ta.focus(); toast("JSONを貼り付けて、もう一度「貼り付けで読み込む」"); break; }
      const v = ta.value; ta.value = ""; ta.hidden = true; importJson(v); render();
      break;
    }
    case "copyjson": {
      try { await navigator.clipboard.writeText(exportPayload()); toast("JSONをコピーしました"); }
      catch { toast("コピーできませんでした"); }
      break;
    }
  }
});
["compositionend", "change"].forEach((t) => document.addEventListener(t, (ev) => { if (ev.target.id === "answer") st.draft = ev.target.value; }));
document.addEventListener("input", (ev) => { if (ev.target.id === "answer") { st.draft = ev.target.value; const h = $("#micHint"); if (h && ev.target.value) h.hidden = true; } });
document.addEventListener("focusin", (ev) => { if (ev.target.id === "answer") { document.body.classList.add("typing"); if (!ev.target.value) { const h = $("#micHint"); if (h) h.hidden = false; } } });
document.addEventListener("focusout", (ev) => { if (ev.target.id === "answer") setTimeout(() => { if (document.activeElement?.id !== "answer") { document.body.classList.remove("typing"); const h = $("#micHint"); if (h && !ev.target.value) h.hidden = true; } }, 150); });
document.addEventListener("keydown", (ev) => {
  if (ev.target.id === "answer" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); submitAnswer(false); }
});

function userIsTyping() {
  const a = document.activeElement;
  if (a && $("#view")?.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return true;
  return [...document.querySelectorAll("#view textarea, #view input")].some((el) => el.type !== "file" && el.value && !el.hidden);
}
listeners.add(() => {
  const busy = (st.tab !== "practice" || st.view === "home") && !(st.tab === "review" && rv.mode === "flash");
  if (busy && !userIsTyping()) render(); else renderLevelPill();
});

const hash = location.hash.replace("#", "");
if (["practice", "review", "stats"].includes(hash)) st.tab = hash;
render();
initDb();
})();
</script>
