<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Masa English">
<title>Masa English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Masa English — cobalt + aqua on a softly lit cool background. One phone column, a pinned action bar during questions, a fixed tab bar. */
:root {
  --bg: #F3F6FC;
  --glow-1: rgba(42, 91, 246, 0.16);
  --glow-2: rgba(20, 184, 196, 0.14);
  --glow-3: rgba(255, 255, 255, 0.9);
  --surface: #FFFFFF;
  --surface-2: #F7F9FD;
  --sunk: #EBEFF7;
  --ink: #0E1630;
  --ink-2: #36415C;
  --muted: #5A6680;
  --line: #E3E8F1;
  --line-strong: #CBD3E1;
  --accent: #2A5BF6;
  --accent-2: #14B8C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8EEFF;
  --accent-line: #AFC3FB;
  --accent-glow: rgba(42, 91, 246, 0.28);
  --bubble: #EEF2FA;
  --good: #0D8063;
  --warn: #A85400;
  --bad: #D2352A;
  --good-soft: #E2F5EE;
  --warn-soft: #FDF0DF;
  --bad-soft: #FDE6E3;
  --bar: rgba(255, 255, 255, 0.78);
  --card-edge: rgba(14, 22, 48, 0.06);
  --shadow: 0 1px 2px rgba(14, 22, 48, 0.04), 0 12px 32px -8px rgba(30, 52, 120, 0.14);
  --shadow-soft: 0 1px 2px rgba(14, 22, 48, 0.04), 0 4px 14px -6px rgba(30, 52, 120, 0.10);
  --shadow-sm: 0 1px 3px rgba(14, 22, 48, 0.14);
  --seg-on: #FFFFFF;
  --font-ui: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --font-en: "Atkinson Hyperlegible", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 20px;
  --r-sm: 12px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090E1A; --glow-1: rgba(64, 112, 255, 0.24); --glow-2: rgba(30, 200, 214, 0.13); --glow-3: rgba(9, 14, 26, 0);
    --surface: #121A2C; --surface-2: #0F1626; --sunk: #1C2640; --ink: #EAF0FB; --ink-2: #C3CDE0; --muted: #8E9AB4;
    --line: #222D45; --line-strong: #33405E; --accent: #7C9DFF; --accent-2: #43D2DE; --accent-ink: #08101F; --accent-soft: #1A2754; --accent-line: #3A5299;
    --accent-glow: rgba(124, 157, 255, 0.30); --bubble: #1A2338; --good: #45D3A6; --warn: #F2AE55; --bad: #FF8577; --good-soft: #10302A; --warn-soft: #35291A; --bad-soft: #3E1F1E;
    --bar: rgba(18, 26, 44, 0.80); --card-edge: rgba(255, 255, 255, 0.06); --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 16px 36px -12px rgba(0, 0, 0, 0.6);
    --shadow-soft: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 6px 18px -8px rgba(0, 0, 0, 0.5); --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.5); --seg-on: #2C3A5C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090E1A; --glow-1: rgba(64, 112, 255, 0.24); --glow-2: rgba(30, 200, 214, 0.13); --glow-3: rgba(9, 14, 26, 0);
  --surface: #121A2C; --surface-2: #0F1626; --sunk: #1C2640; --ink: #EAF0FB; --ink-2: #C3CDE0; --muted: #8E9AB4;
  --line: #222D45; --line-strong: #33405E; --accent: #7C9DFF; --accent-2: #43D2DE; --accent-ink: #08101F; --accent-soft: #1A2754; --accent-line: #3A5299;
  --accent-glow: rgba(124, 157, 255, 0.30); --bubble: #1A2338; --good: #45D3A6; --warn: #F2AE55; --bad: #FF8577; --good-soft: #10302A; --warn-soft: #35291A; --bad-soft: #3E1F1E;
  --bar: rgba(18, 26, 44, 0.80); --card-edge: rgba(255, 255, 255, 0.06); --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 16px 36px -12px rgba(0, 0, 0, 0.6);
  --shadow-soft: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 6px 18px -8px rgba(0, 0, 0, 0.5); --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.5); --seg-on: #2C3A5C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background-color: var(--bg); background-image: radial-gradient(120% 60% at 0% 0%, var(--glow-1), transparent 62%), radial-gradient(90% 50% at 100% 4%, var(--glow-2), transparent 60%), linear-gradient(180deg, var(--glow-3), transparent 340px); background-repeat: no-repeat; background-size: 100% 640px; }
body { color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.65; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; font-feature-settings: "palt" 1; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.4; letter-spacing: 0.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 0.95rem; font-weight: 700; }
p { margin: 0; }
.en-font, .en { font-family: var(--font-en); }

.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
main#view { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-en); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 18px; height: 18px; }
.brand span { color: var(--accent); font-weight: 400; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 0.8rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.flat { background: transparent; border: 0; padding: 4px 2px; }
.card.lift { box-shadow: var(--shadow); border-color: transparent; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); font-size: 0.9rem; }
.small { font-size: 0.82rem; line-height: 1.6; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

/* buttons */
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; transition: transform 0.12s ease, background-color 0.15s ease; }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 0.88rem; border-radius: 12px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.btn .sub { display: block; font-weight: 500; font-size: 0.78rem; opacity: 0.85; }
.btn.stack { flex-direction: column; gap: 0; line-height: 1.35; padding-block: 10px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--ink-2); transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
.icon-btn[data-speak] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.icon-btn[data-save] svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.icon-btn.saved { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.icon-btn.saved svg { fill: currentColor; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* segmented controls & scene tiles */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 13px; }
.seg .chip { border: 0; background: transparent; min-height: 40px; border-radius: 10px; font-size: 0.88rem; font-weight: 500; color: var(--ink-2); padding: 6px 4px; }
.seg .chip[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-sm); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tiles .chip { border: 1px solid var(--line); background: var(--surface-2); min-height: 48px; border-radius: 12px; font-size: 0.92rem; font-weight: 500; padding: 6px 4px; }
.tiles .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.filter .chip { border: 1px solid var(--line); background: var(--surface); min-height: 44px; padding: 6px 16px; border-radius: 999px; font-size: 0.9rem; font-weight: 500; }
.filter .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.setting { display: flex; flex-direction: column; gap: 8px; }
.setting .lbl { font-size: 0.85rem; color: var(--ink-2); font-weight: 700; }

/* home */
.hero { padding: 6px 2px 2px; display: flex; align-items: center; gap: 10px; }
.hero h1 { font-size: 1.5rem; line-height: 1.4; font-weight: 700; letter-spacing: 0.01em; }
.hero p { color: var(--accent); background: var(--accent-soft); font-size: 0.85rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.today { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.today div { padding: 10px 14px; display: flex; flex-direction: column; }
.today div + div { border-left: 1px solid var(--line); }
.today .v { font-family: var(--font-en); font-weight: 700; font-size: 1.4rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.today .v small { font-family: var(--font-ui); font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
.today .l { font-size: 0.76rem; color: var(--muted); font-weight: 500; }
.preview { position: relative; background: var(--surface-2); border-style: dashed; }
.howto { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 0.86rem; color: var(--ink-2); counter-reset: s; margin: 0; padding: 0; list-style: none; }
.howto li { display: contents; }
.howto li::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); color: var(--ink-2); font-size: 0.74rem; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }

/* question */
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.q-meta .scene { font-size: 0.8rem; color: var(--muted); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-meta .count { font-family: var(--font-en); font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; flex: none; }
.q-meta .count small { color: var(--muted); font-weight: 400; }
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.progress i { height: 5px; border-radius: 5px; background: var(--sunk); }
.progress i.done { background: var(--accent); }
.progress i.now { background: var(--ink); }
.setting-note { font-size: 0.84rem; color: var(--muted); padding-left: 10px; border-left: 3px solid var(--line-strong); }
.partner { display: flex; gap: 10px; align-items: flex-end; }
.partner .bubble { background: var(--bubble); border-radius: 18px 18px 18px 6px; padding: 10px 14px 12px; font-family: var(--font-en); font-size: 1.05rem; line-height: 1.5; flex: 1; min-width: 0; color: var(--ink); }
.partner .who { font-size: 0.72rem; color: var(--muted); font-family: var(--font-ui); font-weight: 700; display: block; margin-bottom: 2px; letter-spacing: 0.04em; }
.prompt-wrap { display: flex; flex-direction: column; gap: 6px; }
.prompt-ja { font-size: 1.5rem; font-weight: 700; line-height: 1.6; letter-spacing: 0.02em; color: var(--ink); }
.prompt-label { font-size: 0.74rem; color: var(--accent); font-weight: 700; letter-spacing: 0.06em; }
.timer { display: flex; align-items: center; gap: 12px; }
.timer .bar { flex: 1; height: 10px; border-radius: 10px; background: var(--sunk); overflow: hidden; }
.timer .fill { height: 100%; width: 100%; background: var(--accent); border-radius: 10px; transform-origin: left; }
.timer .sec { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 5em; text-align: right; font-size: 0.95rem; }
.timer.low .fill { background: var(--warn); }
.timer.low .sec { color: var(--warn); }
.timer.over .fill { background: var(--bad); }
.timer.over .sec { color: var(--bad); }
textarea { display: block; width: 100%; min-height: 120px; border: 1.5px solid var(--line-strong); border-radius: 16px; padding: 14px; font-family: var(--font-en); font-size: 1.08rem; line-height: 1.5; background: var(--surface); color: var(--ink); resize: vertical; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
textarea::placeholder { color: var(--muted); font-family: var(--font-ui); font-size: 0.95rem; }
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.mic-hint { display: flex; gap: 8px; align-items: flex-start; font-size: 0.82rem; color: var(--muted); line-height: 1.55; }
.mic-btn { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.mic-btn svg { width: 20px; height: 20px; }
body.typing nav.tabs { display: none; }
body.typing .actionbar { position: static; }
.mic-hint svg { width: 16px; height: 16px; fill: currentColor; flex: none; margin-top: 2px; }
.answered { display: flex; gap: 8px; align-items: center; font-size: 0.84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.answered b { color: var(--ink); }
.answered .over { color: var(--bad); font-weight: 700; }

/* pinned action bar (sits just above the tab bar) */
.actionbar { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 4; display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: 8px; margin: 0 -8px; background: var(--bar); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.actionbar.one { grid-template-columns: 1fr; }
.actionbar .btn { min-height: 52px; }

/* feedback */
.score-head { display: flex; align-items: center; gap: 16px; }
.ring { --p: 0; width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(currentColor calc(var(--p) * 1%), var(--sunk) 0); }
.ring > div { width: 68px; height: 68px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; line-height: 1; }
.ring .n { font-family: var(--font-en); font-weight: 700; font-size: 1.75rem; font-variant-numeric: tabular-nums; }
.ring .u { display: block; font-size: 0.66rem; color: var(--muted); font-weight: 700; margin-top: 3px; }
.ring.empty { background: var(--sunk); color: var(--muted); }
.score-head .sum { flex: 1; min-width: 0; font-size: 0.95rem; line-height: 1.65; }
.score-num { font-family: var(--font-en); font-size: 2.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score-num small { font-size: 0.9rem; color: var(--muted); font-family: var(--font-ui); font-weight: 500; }
.tone-good { color: var(--good); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); }
.axes-overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.axes-overview div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.axes-overview .l { font-size: 0.72rem; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.axes-overview .v { font-family: var(--font-en); font-weight: 700; font-size: 1.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.block-label { font-size: 0.74rem; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.yours-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.axis { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.axis-head { display: flex; align-items: center; gap: 12px; }
.axis-head h3 { flex: none; }
.meter { flex: 1; height: 6px; background: var(--sunk); border-radius: 6px; overflow: hidden; min-width: 40px; }
.meter b { display: block; height: 100%; border-radius: 6px; }
.axis-head .n { font-family: var(--font-en); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1rem; min-width: 2.2em; text-align: right; }
.point { border-left: 3px solid var(--line-strong); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 3px; }
.point .from { font-family: var(--font-en); text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 1.5px; color: var(--muted); }
.point .to { font-family: var(--font-en); font-weight: 700; color: var(--good); }
.point .to::before { content: "→ "; color: var(--muted); font-weight: 400; }
.point .why { font-size: 0.88rem; color: var(--ink-2); }
.ok-line { color: var(--good); font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.ok-line::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.en-line { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.en-line:first-of-type { border-top: 0; }
.en-line .txt { flex: 1; min-width: 0; }
.en-line .en { font-size: 1.06rem; line-height: 1.45; color: var(--ink); }
.en-line .note { font-size: 0.83rem; color: var(--muted); margin-top: 2px; }
.model-box { background: var(--accent-soft); border-radius: 14px; padding: 4px 12px; }
.model-box .en-line .en { font-weight: 700; }
.model-box .icon-btn[data-speak] { background: var(--surface); }
.tag { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); margin-right: 6px; vertical-align: 2px; font-family: var(--font-ui); }
.key-box { border: 1.5px solid var(--accent-line); border-radius: 14px; padding: 4px 12px; }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.92rem; }
.dots { display: inline-flex; }
.dots i { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: 0.2s; } .dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 0.88rem; border-left: 3px solid var(--warn); }
.notice.err { background: var(--bad-soft); border-left-color: var(--bad); }

/* summary */
.res-item { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.res-item:first-child { border-top: 0; padding-top: 0; }
.res-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.res-top .s { font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-en); }

/* stats */

/* nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }

/* color system v3: layered background, crisp elevated surfaces, cobalt + aqua */

<script src="config.js"></script>
<script>
(() => {
"use strict";

/* ---------- Built-in scenes (used when AI is unavailable, and as first rounds) ---------- */
const BUILTIN = [
  { id: "b-weekly", type: "会議", title: "週次定例ミーティング", setting: "チームの週次定例。司会はマネージャーのJessicaです。", turns: [
    { partner: "Okay, let's get started. Who wants to go first?", ja: "では私から。先週の進捗を簡単に共有させてください。", en: "I'll go first. Let me quickly share where things stand from last week." },
    { partner: "Sure, go ahead.", ja: "新機能のテストは予定より2日ほど遅れています。", en: "Testing for the new feature is running about two days behind schedule." },
    { partner: "What's causing the delay?", ja: "想定外のバグがいくつか見つかって、修正に時間がかかっています。", en: "We found a few unexpected bugs, and fixing them is taking longer than we thought." },
    { partner: "Do you need any help from my team?", ja: "助かります。もし可能なら、テスト担当を一人貸してもらえますか？", en: "That would be great. If possible, could you lend us one of your testers?" },
    { partner: "I can probably do that. When do you need them?", ja: "水曜日から入ってもらえれば、金曜日には遅れを取り戻せると思います。", en: "If they could start on Wednesday, I think we can catch up by Friday." } ] },
  { id: "b-monday", type: "雑談", title: "月曜朝の雑談", setting: "月曜の朝、オフィスで同僚のMikeに声をかけられました。", turns: [
    { partner: "Morning! How was your weekend?", ja: "おはようございます。のんびり過ごせて、いい週末でした。", en: "Morning! It was nice, thanks. I got to take it easy." },
    { partner: "Nice. Did you do anything fun?", ja: "土曜日に家族と鎌倉まで日帰りで出かけました。", en: "On Saturday, I took a day trip to Kamakura with my family." },
    { partner: "Oh, I've always wanted to go there. How was it?", ja: "天気も良くて、思ったほど混んでいませんでした。", en: "The weather was great, and it wasn't as crowded as I expected." },
    { partner: "Any recommendations if I go?", ja: "駅の近くに美味しいしらす丼のお店があるので、ぜひ行ってみてください。", en: "There's a great whitebait rice bowl place near the station. You should definitely check it out." },
    { partner: "Thanks, I'll put it on my list!", ja: "よかったら、あとでお店の名前を送りますね。", en: "I can send you the name of the place later if you want." } ] },
  { id: "b-call", type: "電話", title: "取引先からの電話", setting: "取引先BrightlineのSarahから、先週送った見積もりについて電話がありました。", turns: [
    { partner: "Hi, this is Sarah from Brightline. Is now a good time?", ja: "はい、大丈夫です。お電話ありがとうございます。", en: "Yes, now's fine. Thanks for calling, Sarah." },
    { partner: "I'm calling about the quote you sent last week.", ja: "ありがとうございます。何かご不明な点がありましたか？", en: "Thanks. Did you have any questions about it?" },
    { partner: "Yes, the price is a bit higher than our budget.", ja: "なるほど。どのくらいの金額をお考えですか？", en: "I see. What price range did you have in mind?" },
    { partner: "Ideally, around ten percent lower.", ja: "社内で検討して、明日までにお返事してもよろしいですか？", en: "Would it be okay if I discussed it internally and got back to you by tomorrow?" },
    { partner: "That works. Thanks for being flexible.", ja: "とんでもないです。ではまた明日ご連絡します。", en: "Not at all. I'll get back to you tomorrow, then." } ] },
  { id: "b-1on1", type: "1on1", title: "上司との1on1", setting: "上司のDavidと月1回の1on1ミーティングです。", turns: [
    { partner: "So, how are things going on your end?", ja: "全体的には順調ですが、少し業務量が多いと感じています。", en: "Overall things are going well, but my workload feels a bit heavy." },
    { partner: "I see. Which part is taking up the most time?", ja: "特に、毎週のレポート作成にかなり時間を取られています。", en: "The weekly reports in particular are taking up a lot of my time." },
    { partner: "Do you have any ideas to improve that?", ja: "テンプレートを作れば、作業時間を半分くらいにできると思います。", en: "I think if we made a template, I could cut the time in half." },
    { partner: "That sounds great. Go ahead and try it.", ja: "ありがとうございます。来週までに試作版をお見せしますね。", en: "Thanks. I'll show you a first draft by next week." },
    { partner: "Anything else on your mind?", ja: "実は、来年は海外のプロジェクトにも挑戦してみたいと思っています。", en: "Actually, I'd like to try working on an overseas project next year." } ] },
  { id: "b-lunch", type: "雑談", title: "ランチのお誘い", setting: "昼前、隣の席のEmilyがランチに誘ってくれました。", turns: [
    { partner: "Hey, have you had lunch yet?", ja: "まだです。ちょうど今行こうと思っていたところです。", en: "Not yet. I was just about to go." },
    { partner: "Want to try the new Thai place downstairs?", ja: "いいですね。辛いものが好きなので、ぜひ行きたいです。", en: "Sounds good. I love spicy food, so I'm in." },
    { partner: "I heard it gets busy around noon.", ja: "じゃあ、混む前に少し早めに出ましょうか。", en: "Then why don't we head out a little early, before it gets crowded?" },
    { partner: "Good idea. Give me five minutes to finish this email.", ja: "急がなくて大丈夫ですよ。エレベーターの前で待っています。", en: "No rush. I'll wait for you by the elevators." },
    { partner: "This is really good. How's yours?", ja: "思ったより辛いですが、すごく美味しいです。", en: "It's spicier than I expected, but it's really good." } ] },
  { id: "b-kickoff", type: "会議", title: "プロジェクトのキックオフ", setting: "新しい広告プロジェクトのキックオフ。進行役はPMのRachelです。", turns: [
    { partner: "Thanks for joining, everyone. Could you introduce yourself first?", ja: "マーケティング部のMasaです。今回は広告の企画を担当します。", en: "I'm Masa from Marketing. I'll be handling the planning for the ad campaign." },
    { partner: "Great. What's your main goal for this project?", ja: "一番の目標は、若い世代の新規顧客を増やすことです。", en: "Our main goal is to bring in more new customers from younger generations." },
    { partner: "How do you plan to reach them?", ja: "主にSNSを活用して、短い動画広告を出す予定です。", en: "We're planning to focus on social media and run short video ads." },
    { partner: "What's the timeline looking like?", ja: "来月中に企画をまとめて、12月に公開したいと考えています。", en: "We'd like to finalize the plan next month and launch in December." },
    { partner: "Any concerns at this point?", ja: "強いて言えば、制作予算が足りるかどうかが少し心配です。", en: "If anything, I'm a little worried about whether the production budget will be enough." } ] }
];
const SCENE_TYPES = ["おまかせ", "会議", "雑談", "電話", "1on1", "取引先"];
const TYPE_IDEAS = {
  "会議": "a team meeting, status update, brainstorming, decision-making or problem-solving discussion",
  "雑談": "casual small talk with a coworker (weekend, food, hobbies, travel, weather, family, the commute)",
  "電話": "a phone call (client, vendor, colleague in another office, rescheduling, a problem report)",
  "1on1": "a one-on-one with a manager or a direct report (feedback, career, workload, goals)",
  "取引先": "talking with a client or partner face to face (visit, negotiation, dinner, showing them around)"
};
const LEVELS = ["A2", "B1", "B2", "C1", "C2"];

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tone = (n) => (n >= 80 ? "good" : n >= 60 ? "warn" : "bad");
const toneVar = (n) => `var(--${tone(n)})`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4ZM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23Z"/></svg>';
const ICON_SAVE = '<svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v18l-8-4-8 4V4a2 2 0 0 1 2-2Z"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>';

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
}

/* ---------- settings (per device) ---------- */
const settings = Object.assign({ pace: "normal", rate: 0.9, type: "おまかせ" }, lsGet("me.settings", {}));
const saveSettings = () => lsSet("me.settings", settings);
const PACE = { slow: { label: "ゆったり", k: 1.4 }, normal: { label: "標準", k: 1 }, fast: { label: "速め", k: 0.7 } };
function timeLimit(ja) {
  const len = [...String(ja)].length;
  return Math.max(10, Math.min(60, Math.round((10 + len * 0.5) * PACE[settings.pace].k)));
}

/* ---------- speech (model audio) ---------- */
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter((v) => /^en[-_]US/i.test(v.lang));
  voice = vs.find((v) => /Samantha|Aaron|Nicky|Google US English|Jenny|Aria/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!("speechSynthesis" in window)) { toast("この端末では音声を再生できません"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = settings.rate; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------- storage: artifact db when available, device storage otherwise ---------- */
const data = { phrases: [], attempts: [], ready: false, mode: "local" };
let db = null;
const listeners = new Set();
const changed = () => listeners.forEach((f) => f());

function loadLocal() {
  data.phrases = lsGet("me.phrases", []);
  data.attempts = lsGet("me.attempts", []);
}
function saveLocal() { lsSet("me.phrases", data.phrases); lsSet("me.attempts", data.attempts); }
loadLocal();

async function initDb() {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { data.ready = true; changed(); return; }
  data.mode = "db";
  db.collection("phrases").orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => {
    data.phrases = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    data.ready = true; changed();
  }, () => { data.mode = "local"; loadLocal(); data.ready = true; changed(); });
  db.collection("attempts").orderBy("at", "desc").limit(1000).onSnapshot((snap) => {
    data.attempts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    data.ready = true; changed();
  }, () => {});
}
async function addAttempt(a) {
  const id = uid();
  if (data.mode === "db") { try { await db.doc("attempts/" + id).set(a); return; } catch {} }

/* AI goes through the Cloudflare Worker relay (see worker/worker.js). */
function parseJsonLoose(text) {
  const t = String(text || "").trim();
  try { return JSON.parse(t); } catch {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  throw { code: "invalid_json" };
}
const relay = {
  async json(prompt, opts = {}) {
    const url = (window.MASA_CONFIG && window.MASA_CONFIG.workerUrl) || "";
    if (!url) throw { code: "no_worker" };
    if (!settings.pass) throw { code: "no_pass" };
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + settings.pass },
        body: JSON.stringify({ kind: opts.modelTier === "quick" ? "scene" : "grade", prompt }) });
    } catch { throw { code: "upstream_error" }; }
    if (res.status === 401) throw { code: "bad_pass" };
    if (res.status === 429) throw { code: "rate_limited" };
    const out = await res.json().catch(() => null);
    if (out?.code === "upstream_error" && out.status === 401) throw { code: "bad_api_key" };
    if (out?.code === "upstream_error" && (out.status === 400 || out.status === 403) && /credit|billing/i.test(String(out.detail || ""))) throw { code: "no_credit" };
    if (!res.ok || !out) throw { code: out?.code || "upstream_error" };
    return parseJsonLoose(out.text);
  }
};
const getSample = async () => relay;
const aiOff = { flag: false };
function aiErrorText(e) {
  switch (e?.code) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      aiOff.flag = true; return "AIの利用が許可されていないため、添削できません。";
    case "server_not_configured": return "CloudflareでANTHROPIC_API_KEYかAPP_TOKENが設定されていません。";
    case "bad_api_key": return "APIキーが正しくありません。CloudflareのANTHROPIC_API_KEYを確認してください。";
    case "no_worker": return "中継サーバーのURLが設定されていません（config.js）。";
    case "no_pass": return "ホーム画面の設定で「合言葉」を入力してください。";
    case "bad_pass": return "合言葉が違います。ホーム画面の設定で確認してください。";
    case "refused": return "AIがこの内容への回答を控えました。言い方を変えて再試行してください。";
    case "rate_limited": return "AIの利用が混み合っています。少し時間をおいてから再試行してください。";
    case "session_expired": return "ログインが切れています。Claudeに再ログインしてください。";
    case "invalid_json": case "empty_completion": return "AIの返答を読み取れませんでした。再試行してください。";
    default: return "通信エラーで添削できませんでした。再試行してください。";
  }
}

async function generateScene(type) {
  const sample = await getSample();
  if (!sample || aiOff.flag) throw { code: "not_granted" };
  const realType = type === "おまかせ" ? pickAutoType() : type;
  const recent = lsGet("me.recentScenes", []).slice(0, 12);
  const prompt = `You write practice material for "瞬間英作文" speaking drills. The learner is a Japanese professional (TOEIC about 800) learning natural American workplace English.

Create ONE realistic workplace conversation scene. Scene type: ${realType} (${TYPE_IDEAS[realType] || "workplace conversation"}).
Do not reuse these recent scene titles or situations: ${recent.length ? recent.join(" / ") : "(none)"}.

The learner plays one person (named Masa, works at a Japanese company with American colleagues). Write exactly 5 turns that form ONE coherent conversation, in order. Each turn:
- "partner": what the other person says to Masa, natural spoken American English, at most 22 words.
- "ja": what Masa should say next, written as natural spoken Japanese, 15 to 45 characters. It must be a natural reply to "partner" and move the conversation forward.
- "en": a natural model answer in spoken American English that a native coworker would actually say, matching the tone of the scene (not stiff textbook English).
Mix in useful workplace expressions (scheduling, giving updates, agreeing/disagreeing politely, asking for help, small-talk reactions) suited to a B2 learner.

Reply with only JSON in this shape:
{"title":"日本語のシーン名(16字以内)","type":"${realType}","setting":"相手の名前・関係・状況を日本語1文で","turns":[{"partner":"...","ja":"...","en":"..."}]}`;
  const out = await sample.json(prompt, { modelTier: "quick", cache: false });
  if (!out || !Array.isArray(out.turns) || out.turns.length < 5) throw { code: "invalid_json" };
  const turns = out.turns.slice(0, 5).map((t) => ({ partner: String(t.partner || ""), ja: String(t.ja || ""), en: String(t.en || "") }));
  if (turns.some((t) => !t.ja || !t.en)) throw { code: "invalid_json" };
  return { id: "ai-" + uid(), type: String(out.type || realType), title: String(out.title || "新しいシーン"), setting: String(out.setting || ""), turns, ai: true };
}
function pickAutoType() {
  const order = ["会議", "雑談", "電話", "1on1", "取引先"];
  const i = lsGet("me.autoIdx", 0); lsSet("me.autoIdx", (i + 1) % order.length);
  return order[i % order.length];
}

async function gradeAnswer(scene, idx, answer) {
  const sample = await getSample();
  if (!sample || aiOff.flag) throw { code: "not_granted" };
  const t = scene.turns[idx];
  const prev = scene.turns.slice(0, idx).map((x) => `Partner: ${x.partner}\nMasa: ${x.en}`).join("\n");
  const prompt = `あなたはアメリカ英語のスピーキングコーチです。生徒は日本人の社会人（TOEIC 800程度）で、職場で使う自然なアメリカ英語を練習しています。「瞬間英作文」形式で、日本語を見て即座に英語で話した答えを添削してください。

# シーン
${scene.title}：${scene.setting}
${prev ? "# ここまでの会話\n" + prev + "\n" : ""}# 相手のセリフ
${t.partner}
# 生徒が言うべき内容（日本語）
${t.ja}
# 参考の模範解答
${t.en}
# 生徒の回答（iPhoneの音声入力で書き起こしたもの）
${answer}

# 添削のルール
- 音声入力の書き起こしなので、大文字小文字・句読点・明らかな聞き取り誤変換（同音異義語など）は減点しない。
- 3つの視点で評価する：
  1. grammar（文法）：時制、冠詞、前置詞、語順、主語と動詞の一致など。
  2. nuance（ニュアンス・表現）：日本語の意図が伝わるか、相手との関係や場面に合った丁寧さ・トーンか、ネイティブが実際に使う語彙か。直訳調や教科書的すぎる表現も指摘する。
  3. structure（構成）：情報の順番、相手のセリフへの自然な受け答えになっているか、一言目の入り方、文のつなぎ方、長さ。
- 各視点の指摘は重要なものだけ最大3つ。問題がなければ空配列。
- 解説（why、note、summary）はすべて日本語で、具体的に短く書く。
- アメリカ英語を基準にする。
- 参考の模範解答は一例にすぎない。模範解答と言い方が違っても、日本語の意図が伝わり自然で正しい英語なら減点しない。
- 回答が空・日本語のみ・内容が大きく欠けている場合は低い点数にし、どう言えばよいかを示す。
- score の目安：90以上＝自然で正確、75〜89＝十分通じるが小さな改善点あり、60〜74＝意味は伝わるが不自然・誤りあり、60未満＝意味が伝わりにくい。
- natural は生徒の回答をもとに、より自然な言い方を2〜3個。トーンの違い（カジュアル／標準／丁寧）が分かるようにする。
- keyPhrase はこの問題で覚えるべき一番大事な英語表現（短いフレーズ）。
- cefr はこの回答だけから推定される話す力のCEFRレベル（A2/B1/B2/C1/C2のどれか）。生徒の普段のレベルを前提にしない。

# 出力（JSONのみ）
{"score":0-100の整数,"scores":{"grammar":0-100,"nuance":0-100,"structure":0-100},"summary":"総評を日本語1〜2文","grammar":[{"from":"生徒の該当部分","to":"直した英語","why":"日本語の解説"}],"nuance":[{"from":"","to":"","why":""}],"structure":[{"from":"","to":"","why":""}],"corrected":"生徒の回答を最小限の修正で正しくした英文","natural":[{"en":"より自然な英語","tone":"カジュアル|標準|丁寧","note":"日本語で使いどころ"}],"keyPhrase":{"en":"","ja":"","note":"日本語の解説"},"cefr":"B2"}`;
  const fb = await sample.json(prompt, { cache: false });
  if (!fb || typeof fb.score !== "number") throw { code: "invalid_json" };
  const clamp = (n) => Math.max(0, Math.min(100, Math.round(Number(n) || 0)));
  fb.score = clamp(fb.score);
  fb.scores = { grammar: clamp(fb.scores?.grammar), nuance: clamp(fb.scores?.nuance), structure: clamp(fb.scores?.structure) };
  for (const k of ["grammar", "nuance", "structure", "natural"]) fb[k] = Array.isArray(fb[k]) ? fb[k] : [];
  fb.cefr = LEVELS.includes(fb.cefr) ? fb.cefr : null;
  return fb;
}

  if (!s) { s = pool[0]; lsSet("me.usedBuiltin", used.filter((id) => !pool.some((p) => p.id === id))); }
  return s;
}
function markBuiltinUsed(id) { const u = lsGet("me.usedBuiltin", []); if (!u.includes(id)) { u.push(id); lsSet("me.usedBuiltin", u); } }

async function startRound(useAI) {
  stopTimer();

    st.view = "loading"; st.loadingMsg = "シーン作成中"; render();

function showQuestion() {

}
function stopTimer() { cancelAnimationFrame(st.raf); st.raf = 0; }
function startTimer() {
  stopTimer();
  const tick = () => {
    const box = $("#timer"); if (!box || st.view !== "question" || st.results[st.idx]) return;
    const el = (performance.now() - st.startAt) / 1000;
    const left = st.limit - el;
    box.classList.toggle("low", left <= st.limit * 0.3 && left > 0);
    box.classList.toggle("over", left <= 0);
    $(".fill", box).style.transform = `scaleX(${Math.max(0, left / st.limit)})`;
    $(".sec", box).textContent = left > 0 ? `残り ${Math.ceil(left)}秒` : `+${Math.floor(-left)}秒`;
    st.raf = requestAnimationFrame(tick);
  };
  st.raf = requestAnimationFrame(tick);
}

async function submitAnswer(pass) {
  if (mic.active) micStop();
  const ta = $("#answer");
  const answer = pass ? "" : (ta?.value || "").trim();
  if (!pass && !answer) { toast("英語で回答を入力してください"); ta?.focus(); return; }
  stopTimer();
  const seconds = Math.round(((performance.now() - st.startAt) / 1000) * 10) / 10;
  const idx = st.idx, scene = st.scene;
  const r = { answer, seconds, limit: st.limit, pass: !!pass, status: pass ? "pass" : "pending", fb: null, error: "" };
  st.results[idx] = r;
  render();
  if (pass) return;
  runGrade(scene, idx, r);
}
async function runGrade(scene, idx, r) {
  r.status = "pending"; r.error = ""; rerenderIfVisible(scene, idx);
  try {
    r.fb = await gradeAnswer(scene, idx, r.answer);
    r.status = "done";
    const t = scene.turns[idx];
    addAttempt({ schema: "masa-english/attempt@1", at: new Date().toISOString(), day: todayKey(), sceneTitle: scene.title, sceneType: scene.type,
      ja: t.ja, model: t.en, answer: r.answer, score: r.fb.score, scores: r.fb.scores, cefr: r.fb.cefr, seconds: r.seconds, limit: r.limit, overTime: r.seconds > r.limit });
  } catch (e) { r.status = "error"; r.error = aiErrorText(e); }

}
function rerenderIfVisible(scene, idx) {

}

}

function axisHTML(label, score, points, meterOnly) {
  return `<div class="axis">

function feedbackHTML(scene, idx) {
  const t = scene.turns[idx], r = st.results[idx];
  const modelBlock = `<div><div class="block-label">模範解答 ・ お手本音声</div><div class="model-box">${lineHTML(t.en, { ja: t.ja, saveNote: "模範解答", q: idx })}</div></div>`;
  if (!r) return "";
  if (r.status === "pass") return `${modelBlock}`;
  const yours = `<div><div class="block-label">あなたの回答</div><div class="yours-box"><p class="yours" style="font-size:1.02rem">${esc(r.answer)}</p></div></div>`;
  if (r.status === "pending") return `${yours}<div class="loading"><span class="dots"><i></i><i></i><i></i></span>添削中（先に進めます）</div>${modelBlock}`;
  if (r.status === "error") return `${yours}<div class="notice err">${esc(r.error)}</div>${aiOff.flag ? "" : `<button class="btn sm" data-act="retry" data-idx="${idx}">再試行</button>`}${modelBlock}`;
  const fb = r.fb;
  return `
    <div class="score-head"><div class="ring tone-${tone(fb.score)}" style="--p:${fb.score}" role="img" aria-label="${fb.score}点"><div><span><span class="n">${fb.score}</span><span class="u">/ 100</span></span></div></div><p class="sum">${esc(fb.summary || "")}</p></div>

    ${yours}
    ${fb.corrected && fb.corrected.trim() !== r.answer.trim() ? `<div><div class="block-label">修正</div><p class="model" style="font-family:var(--font-en)">${esc(fb.corrected)}</p></div>` : ""}
    ${axisHTML("文法", fb.scores.grammar, fb.grammar)}
    ${axisHTML("ニュアンス・表現", fb.scores.nuance, fb.nuance)}
    ${axisHTML("構成", fb.scores.structure, fb.structure)}
    <div class="axis"><h3>より自然な言い方</h3><div>${fb.natural.map((n) => lineHTML(n.en, { tag: n.tone, note: n.note, ja: t.ja, q: idx })).join("") || `<p class="muted small">なし</p>`}</div></div>
    ${fb.keyPhrase?.en ? `<div class="axis"><h3>覚えたい表現</h3><div class="key-box">${lineHTML(fb.keyPhrase.en, { note: [fb.keyPhrase.ja, fb.keyPhrase.note].filter(Boolean).join(" ・ "), ja: fb.keyPhrase.ja, saveNote: fb.keyPhrase.note, q: idx })}</div></div>` : ""}

}

/* stats */
function stats() {
  const a = data.attempts;
  const recent = a.slice(0, 20);
  const mean = (arr, f) => (arr.length ? Math.round(arr.reduce((s, x) => s + f(x), 0) / arr.length) : null);
  const levelCounts = {}; recent.forEach((x) => x.cefr && (levelCounts[x.cefr] = (levelCounts[x.cefr] || 0) + 1));
  let level = null;
  if (recent.filter((x) => x.cefr).length >= 3) {
    const idxs = recent.filter((x) => x.cefr).map((x) => LEVELS.indexOf(x.cefr)).sort((p, q) => p - q);
    level = LEVELS[idxs[Math.floor(idxs.length / 2)]];
  }
  const byDay = {};
  a.forEach((x) => { (byDay[x.day] ||= []).push(x); });
  const days = Object.keys(byDay).sort().slice(-14).map((d) => ({ d, n: byDay[d].length, avg: mean(byDay[d], (x) => x.score) }));
  const sec = recent.length ? Math.round((recent.reduce((s, x) => s + x.seconds, 0) / recent.length) * 10) / 10 : null;
  const inTime = recent.length ? Math.round((recent.filter((x) => !x.overTime).length / recent.length) * 100) : null;
  return { total: a.length, days, level, avg: mean(recent, (x) => x.score),
    g: mean(recent, (x) => x.scores?.grammar ?? 0), n: mean(recent, (x) => x.scores?.nuance ?? 0), s: mean(recent, (x) => x.scores?.structure ?? 0), sec, inTime, recentN: recent.length };
}
function renderLevelPill() { const s = stats(); $("#levelPill").textContent = s.level ? `推定レベル ${s.level}` : "推定レベル —"; }

function chartSVG(days) {
  if (days.length < 2) return `<p class="empty">2日分以上で表示</p>`;
  const W = 340, H = 150, L = 28, R = 10, T = 12, B = 24;
  const x = (i) => L + (i * (W - L - R)) / (days.length - 1);
  const y = (v) => T + ((100 - v) * (H - T - B)) / 100;
  const pts = days.map((d, i) => [x(i), y(d.avg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`;
  const grid = [0, 50, 100].map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  const step = Math.ceil(days.length / 6);
  const labels = days.map((d, i) => (i % step === 0 || i === days.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === days.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${Number(d.d.slice(5, 7))}/${Number(d.d.slice(8))}</text>` : "").join("");
  const dots = pts.map((p, i) => `<circle class="pt ${i === pts.length - 1 ? "last" : ""}" cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの平均点">${grid}<path class="area" d="${area}"/><path class="ln" d="${line}"/>${dots}${labels}</svg></div>`;
}

  <section class="card">

  </section>`;

/* ---------- connection test: checks the Worker settings without calling the AI ---------- */
async function runPing() {
  const out = $("#pingResult"); if (!out) return;
  const say = (t) => { out.textContent = t; };
  const url = window.MASA_CONFIG?.workerUrl;
  if (!url) return say("NG：config.js にWorkerのURLがありません。");
  if (!settings.pass) return say("NG：先に合言葉を入力して「保存」してください。");
  say("確認中…");
  let res;
  try {
    res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + settings.pass }, body: JSON.stringify({ kind: "ping" }) });
  } catch {
    return say("NG：Workerにつながりません。①Workerのコードが見本（Hello World）のまま ②ALLOWED_ORIGIN が https://masa-git-code.github.io になっていない、のどちらかです。");
  }
  const body = await res.json().catch(() => ({}));
  if (res.status === 400) return say("OK：Workerのコード・ANTHROPIC_API_KEY・APP_TOKEN・ALLOWED_ORIGIN・合言葉はすべて設定されています。APIキーが有効かは、実際に添削して確認してください。");
  if (res.status === 401) return say("NG：合言葉がCloudflareのAPP_TOKENと一致しません。");
  if (body.code === "server_not_configured") return say("NG：CloudflareでANTHROPIC_API_KEYかAPP_TOKEN（シークレット）が設定されていません。");
  if (body.code === "forbidden_origin") return say("NG：ALLOWED_ORIGIN が https://masa-git-code.github.io になっていません。");
  say("NG：予期しない応答です（" + res.status + " " + (body.code || "") + "）。");
}

/* ---------- import (from the earlier Claude version's JSON export) ---------- */
function importJson(text) {
  let obj; try { obj = JSON.parse(text); } catch { toast("JSONを読み取れませんでした"); return; }
  const list = Array.isArray(obj) ? obj : obj?.phrases;
  if (!Array.isArray(list)) { toast("苦手な表現のデータが見つかりません"); return; }
  let added = 0;
  for (const p of list) {
    if (!p || !p.en || isSaved(p.en)) continue;
    data.phrases.push({ id: p.id || uid(), schema: "masa-english/phrase@1", en: String(p.en), ja: String(p.ja || ""), note: String(p.note || ""),
      sceneTitle: p.sceneTitle || "", sceneType: p.sceneType || "", sourceJa: p.sourceJa || "", yourAnswer: p.yourAnswer || "",
      createdAt: p.createdAt || new Date().toISOString(), reviewCount: p.reviewCount || 0, correctCount: p.correctCount || 0,
      lastReviewedAt: p.lastReviewedAt || null, mastered: !!p.mastered, tags: Array.isArray(p.tags) ? p.tags : [] });
    added++;
  }
  data.phrases.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  saveLocal(); changed(); toast(`${added}件を読み込みました`);
}
document.addEventListener("change", (ev) => {
  if (ev.target.id !== "importFile") return;
  const f = ev.target.files?.[0]; if (!f) return;
  f.text().then(importJson); ev.target.value = "";
});

/* ---------- press-and-hold English speech recognition (Safari / Chrome Web Speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const mic = { rec: null, holding: false, toggled: false, active: false, base: "", finals: "", downAt: 0, failed: false };
function micUI() {
  const b = $("#micBtn"), l = $("#micLabel"); if (!b || !l || !SR) return;
  b.classList.toggle("live", mic.active);
  l.textContent = mic.active ? (mic.toggled ? "聞き取り中…（タップで停止）" : "聞き取り中…（離すと停止）") : "押している間だけ英語で聞き取る";
}
function micWrite(interim) {
  const ta = $("#answer"); if (!ta) return;
  const sep = mic.base && !/\s$/.test(mic.base) ? " " : "";
  ta.value = (mic.base + sep + (mic.finals + interim).trim()).trimStart();
  st.draft = ta.value;
}
function micStart() {
  if (!SR || mic.active) return;
  const ta = $("#answer"); if (!ta) return;
  mic.base = ta.value; mic.finals = ""; mic.failed = false;
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) mic.finals += r[0].transcript + " "; else interim += r[0].transcript;
    }
    micWrite(interim);
  };
  rec.onerror = (ev) => {
    mic.failed = true;
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") toast("マイクが許可されていません。Safariの設定でマイクを許可してください");
    else if (ev.error === "no-speech") toast("声が聞き取れませんでした");
    else if (ev.error !== "aborted") toast("音声認識でエラーが起きました");
  };
  rec.onend = () => {
    // Safari sometimes stops on its own after a pause; keep listening while the button is held.
    if ((mic.holding || mic.toggled) && !mic.failed && mic.rec === rec) { mic.base = $("#answer")?.value || ""; mic.finals = ""; try { rec.start(); return; } catch {} }
    mic.active = false; mic.rec = null; mic.toggled = false; micWrite(""); micUI();
  };
  try { rec.start(); mic.rec = rec; mic.active = true; micUI(); }
  catch { mic.active = false; toast("音声認識を開始できませんでした"); }
}
function micStop() { mic.holding = false; mic.toggled = false; try { mic.rec?.stop(); } catch {} }
document.addEventListener("pointerdown", (ev) => {
  const b = ev.target.closest?.("#micBtn"); if (!b || !SR) return;
  ev.preventDefault();
  if (mic.active && mic.toggled) { micStop(); return; }
  mic.holding = true; mic.downAt = performance.now(); micStart();
});
const micRelease = (ev) => {
  if (!mic.holding) return;
  mic.holding = false;
  // A quick tap switches to tap-to-start / tap-to-stop mode instead of stopping at once.
  if (performance.now() - mic.downAt < 350 && mic.active) { mic.toggled = true; micUI(); return; }
  micStop();
};
document.addEventListener("pointerup", micRelease);
document.addEventListener("pointercancel", micRelease);
document.addEventListener("contextmenu", (ev) => { if (ev.target.closest?.("#micBtn")) ev.preventDefault(); });

/* ---------- events ---------- */
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { st.tab = b.dataset.tab; rv.mode = "list"; if (st.tab !== "practice") stopTimer(); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.speak) { speak(b.dataset.speak); return; }
  if (b.dataset.save) {
    const q = b.dataset.q !== "" && b.dataset.q != null ? Number(b.dataset.q) : st.idx;
    const r = st.results?.[q];
    const t = st.scene?.turns?.[q];
    savePhrase(b.dataset.save, b.dataset.ja, b.dataset.note, { scene: st.scene, ja: t?.ja, answer: r?.answer });
    return;
  }
  if (b.dataset.type) { settings.type = b.dataset.type; saveSettings(); render(); return; }
  if (b.dataset.pace) { settings.pace = b.dataset.pace; saveSettings(); render(); return; }
  if (b.dataset.rate) { settings.rate = Number(b.dataset.rate); saveSettings(); render(); return; }
  if (b.dataset.filter) { rv.filter = b.dataset.filter; render(); return; }
  if (b.dataset.del) { rv.confirmDel = b.dataset.del; render(); return; }
  if (b.dataset.delOk) { rv.confirmDel = null; await deletePhrase(b.dataset.delOk); render(); return; }
  switch (b.dataset.act) {
    case "start-ai": startRound(true); break;
    case "start-builtin": startRound(false); break;
    case "submit": submitAnswer(false); break;
    case "ping": { runPing(); break; }
    case "save-pass": { const v = ($("#passInput")?.value || "").trim(); if (!v) { toast("合言葉を入力してください"); break; } settings.pass = v; saveSettings(); aiOff.flag = false; toast("合言葉を保存しました"); render(); break; }
    case "mic": { const ta = $("#answer"); if (ta) { ta.focus(); const h = $("#micHint"); if (h) h.hidden = false; } break; }
    case "pass": submitAnswer(true); break;
    case "next": nextQuestion(); break;
    case "retry": { const i = Number(b.dataset.idx); const r = st.results[i]; if (r) runGrade(st.scene, i, r); break; }
    case "go-practice": st.tab = "practice"; render(); break;
    case "fl-start": {
      const act = data.phrases.filter((p) => !p.mastered);
      rv.queue = act.slice().sort((p, q) => (p.lastReviewedAt || "").localeCompare(q.lastReviewedAt || "")).slice(0, 10);
      rv.i = 0; rv.reveal = false; rv.mode = "flash"; render(); break;
    }
    case "fl-reveal": rv.reveal = true; render(); speak(rv.queue[rv.i].en); break;
    case "fl-ok": case "fl-again": {
      const p = rv.queue[rv.i]; const ok = b.dataset.act === "fl-ok";
      const correct = (p.correctCount || 0) + (ok ? 1 : 0);
      updatePhrase(p.id, { reviewCount: (p.reviewCount || 0) + 1, correctCount: ok ? correct : 0, lastReviewedAt: new Date().toISOString(), mastered: ok && correct >= 3 });
      rv.i++; rv.reveal = false;
      if (rv.i >= rv.queue.length) { rv.mode = "list"; toast(`${rv.queue.length}件の復習が終わりました`); }
      render(); break;
    }
    case "fl-quit": rv.mode = "list"; render(); break;
    case "export": {
      const blob = new Blob([exportPayload()], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `masa-english-phrases-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      break;
    }
    case "import": { $("#importFile")?.click(); break; }
    case "import-paste": {
      const ta = $("#importText"); if (!ta) break;
      if (ta.hidden) { ta.hidden = false; ta.focus(); toast("JSONを貼り付けて、もう一度「貼り付けで読み込む」"); break; }
      importJson(ta.value); ta.value = ""; ta.hidden = true;
      break;
    }
    case "copyjson": {
      try { await navigator.clipboard.writeText(exportPayload()); toast("JSONをコピーしました"); }
      catch { toast("コピーできませんでした"); }
      break;
    }
  }
});
["compositionend", "change"].forEach((t) => document.addEventListener(t, (ev) => { if (ev.target.id === "answer") st.draft = ev.target.value; }));
document.addEventListener("input", (ev) => { if (ev.target.id === "answer") { st.draft = ev.target.value; const h = $("#micHint"); if (h && ev.target.value) h.hidden = true; } });
document.addEventListener("focusin", (ev) => { if (ev.target.id === "answer") { document.body.classList.add("typing"); if (!ev.target.value) { const h = $("#micHint"); if (h) h.hidden = false; } } });
document.addEventListener("focusout", (ev) => { if (ev.target.id === "answer") setTimeout(() => { if (document.activeElement?.id !== "answer") { document.body.classList.remove("typing"); const h = $("#micHint"); if (h && !ev.target.value) h.hidden = true; } }, 150); });
document.addEventListener("keydown", (ev) => {
  if (ev.target.id === "answer" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); submitAnswer(false); }
});

listeners.add(() => { if (st.tab !== "practice" || st.view === "home") render(); else renderLevelPill(); });

const hash = location.hash.replace("#", "");
if (["practice", "review", "stats"].includes(hash)) st.tab = hash;
render();
initDb();
})();
</script>
</body>
</html>
